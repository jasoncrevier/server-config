# Define networks
networks:
# These networks get created by my base-install compose file. Remove them if you aren't using that.
  frontend:
    external: true

# Create volumes
volumes:
  rss-bridge_config:
    name: rss-bridge_config

# Create RSS-Bridge container
services:
  rss-bridge:
    container_name: rss-bridge
    image: rssbridge/rss-bridge:latest
    restart: unless-stopped
    volumes:
      - pico_config:/config
    networks:
      - frontend
    # ports:
      # - 3000:80 # Not required if using the base install
    environment:
      - TZ=America/Toronto